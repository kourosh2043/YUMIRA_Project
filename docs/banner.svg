<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">YUMIRA</title>
  <desc id="d">Banner for YUMIRA, a Persian anime streaming site built with Django. Neon purple and cyan glow around a play button.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080A12"/><stop offset="1" stop-color="#140d2b"/>
    </linearGradient>
    <radialGradient id="glowP" cx="230" cy="160" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9147FF" stop-opacity="0.45"/><stop offset="1" stop-color="#9147FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="1150" cy="40" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0.16"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9147FF"/><stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9b2ff"/>
    </linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#9147FF" fill-opacity="0.14"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowP)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowC)"/>
  <!-- play mark -->
  <g transform="translate(230 160)">
    <circle r="104" fill="none" stroke="url(#ring)" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="3 9"/>
    <circle r="84" fill="none" stroke="url(#ring)" stroke-width="10" filter="url(#blur)" opacity="0.7"/>
    <circle r="84" fill="#0c0f1c" fill-opacity="0.85" stroke="url(#ring)" stroke-width="5"/>
    <path d="M-20 -34 L40 0 L-20 34 Z" fill="url(#ring)" stroke="url(#ring)" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <g font-family="'Space Grotesk', Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="410" y="170" font-size="104" font-weight="700" fill="url(#word)" letter-spacing="14">YUMIRA</text>
    <rect x="416" y="192" width="120" height="4" rx="2" fill="url(#ring)"/>
    <text x="414" y="236" font-size="27" fill="#cfd3e6" letter-spacing="1">Beyond Your Imagination.</text>
    <text x="414" y="274" font-size="15" fill="#7c83a0" letter-spacing="3">DJANGO · PERSIAN RTL · CUSTOM VIDEO PLAYER</text>
  </g>
</svg>
