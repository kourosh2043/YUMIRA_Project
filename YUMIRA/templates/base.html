{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}YUMIRA — Beyond Your Imagination{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Space+Grotesk:wght@400;500;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <div class="container site-header__inner">
      <!-- Temporary logo: plain text plus a simple CSS mark. Replace when the final Emblem logo is ready. -->
      <a class="logo" href="/">
        <span class="logo__mark" aria-hidden="true"></span>
        <span class="logo__text">YUMIRA</span>
      </a>
      <button class="menu-button" id="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="باز و بسته کردن منو">
        <span class="menu-button__bar"></span>
        <span class="menu-button__bar"></span>
        <span class="menu-button__bar"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="منوی اصلی">
        <a class="site-nav__link" data-nav="home" href="/">خانه</a>
        <a class="site-nav__link" data-nav="archive" href="/anime/">آرشیو انیمه‌ها</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer halftone">
    <div class="container site-footer__inner">
      <div>
        <a class="logo" href="/">
          <span class="logo__mark" aria-hidden="true"></span>
          <span class="logo__text">YUMIRA</span>
        </a>
        <p class="site-footer__slogan" lang="en" dir="ltr">Beyond Your Imagination.</p>
      </div>
      <nav class="site-footer__links" aria-label="پیوندهای پایین صفحه">
        <a href="/">خانه</a>
        <a href="/anime/">آرشیو انیمه‌ها</a>
      </nav>
    </div>
    <div class="container site-footer__copy">© YUMIRA — پروژه تمرینی. اطلاعات این نسخه نمونه و خیالی است.</div>
  </footer>

  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
