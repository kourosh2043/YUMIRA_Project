<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Space+Grotesk:wght@400;500;700&family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="page-archive">
  <header class="site-header">
    <div class="container site-header__inner">
      <!-- Temporary logo: plain text plus a simple CSS mark. Replace when the final Emblem logo is ready. -->
      <a class="logo" href="home.html">
        <span class="logo__mark" aria-hidden="true"></span>
        <span class="logo__text">YUMIRA</span>
      </a>
      <button class="menu-button" id="menu-button" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="باز و بسته کردن منو">
        <span class="menu-button__bar"></span>
        <span class="menu-button__bar"></span>
        <span class="menu-button__bar"></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="منوی اصلی">
        <a class="site-nav__link" data-nav="home" href="home.html">خانه</a>
        <a class="site-nav__link" data-nav="archive" href="anime_list.html">آرشیو انیمه‌ها</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="watch fade-in">
      <div class="container">
        <a class="back-link" href="anime_detail.html">→ بازگشت به جزئیات انیمه</a>
        <h1 class="watch__title">شب‌های نئون سایه <span class="ep-number">EP 03</span></h1>
        <p class="watch__subtitle">سایه‌ی بی‌نام</p>

        <div class="player-frame">
          <!-- No video file yet. Later the file comes from the Media folder (uploaded in Django Admin) and is set as the video src. -->
          <video controls playsinline preload="metadata">
            مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
          </video>
        </div>

        <div class="watch__actions">
          <!-- Sample link only. Later it points to the same video file in Media. -->
          <a class="btn btn--primary" href="#">دانلود این قسمت</a>
        </div>

        <!-- Show each button only if that episode exists (the first episode has no previous, the last has no next). -->
        <nav class="episode-nav" aria-label="قسمت‌ها">
          <a class="btn btn--ghost" href="watch.html">→ قسمت قبلی</a>
          <a class="btn btn--ghost" href="watch.html">قسمت بعدی ←</a>
        </nav>
      </div>
    </section>
  </main>

  <footer class="site-footer halftone">
    <div class="container site-footer__inner">
      <div>
        <a class="logo" href="home.html">
          <span class="logo__mark" aria-hidden="true"></span>
          <span class="logo__text">YUMIRA</span>
        </a>
        <p class="site-footer__slogan" lang="en" dir="ltr">Beyond Your Imagination.</p>
      </div>
      <nav class="site-footer__links" aria-label="پیوندهای پایین صفحه">
        <a href="home.html">خانه</a>
        <a href="anime_list.html">آرشیو انیمه‌ها</a>
      </nav>
    </div>
    <div class="container site-footer__copy">© YUMIRA — پروژه تمرینی. اطلاعات این نسخه نمونه و خیالی است.</div>
  </footer>

  <script src="../static/js/main.js"></script>
